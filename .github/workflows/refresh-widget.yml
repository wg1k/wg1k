name: Refresh profile cards

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Test icon lookup
        run: node --test cr-widget/*.test.js

      - name: Regenerate card images
        run: ./cr-widget/screenshot.sh

      - name: Commit updated cards if changed
        run: |
          git add 'cr-widget/*.png' cr-widget/icons
          if git diff --cached --quiet; then
            echo "No change in cards"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "$(cat <<'EOF'
          chore: refresh profile cards

          Scheduled update of the profile card images.
          EOF
          )"
          git push
