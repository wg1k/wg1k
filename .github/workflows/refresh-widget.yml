name: Refresh CodersRank widget

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate widget screenshot
        run: ./cr-widget/screenshot.sh

      - name: Commit updated widget if changed
        run: |
          if git diff --quiet -- cr-widget/widget.png; then
            echo "No change in widget.png"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cr-widget/widget.png
          git commit -m "$(cat <<'EOF'
          chore(cr-widget): refresh widget screenshot

          Scheduled update of the CodersRank widget image.
          EOF
          )"
          git push
