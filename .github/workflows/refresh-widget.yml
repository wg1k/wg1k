name: Refresh profile widgets

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate widget screenshot
        run: ./cr-widget/screenshot.sh

      - name: Refresh Stack Overflow card
        continue-on-error: true
        run: ./stackoverflow/refresh.sh

      - name: Commit updated widgets if changed
        run: |
          if git diff --quiet -- cr-widget/widget.png stackoverflow/card.svg; then
            echo "No change in widgets"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cr-widget/widget.png stackoverflow/card.svg
          git commit -m "$(cat <<'EOF'
          chore: refresh profile widgets

          Scheduled update of the CodersRank widget image and the
          Stack Overflow card.
          EOF
          )"
          git push
